<script>
const APP_BUILD_TAG = window.UI_BUILD_TAG || "unknown"
if (!window.UI_BUILD_TAG){
    console.log("App build:", APP_BUILD_TAG)
}
    
let popupData = {}

let formatClientError = function(error){
    if (!error){
        return "Unknown error"
    }
    if (typeof error === "string"){
        return error
    }
    return error.message || JSON.stringify(error)
}

let notifyUser = function(message, classes){
    let text = String(message || "").trim()
    if (!text){
        return
    }
    if (typeof M !== "undefined" && M && typeof M.toast === "function"){
        M.toast({html: text, classes: classes || ""})
        return
    }
    window.alert(text)
}

let normalizeOwnerEmail = function(email){
    return String(email || "").trim().toLowerCase()
}

let sharedGroupOwnersCompatible = function(left, right){
    let a = normalizeOwnerEmail(left)
    let b = normalizeOwnerEmail(right)
    if (!a || !b || a === b){
        return true
    }
    return a === "unknown" || b === "unknown"
}

let dismissalOwnerKey = function(email){
    let owner = normalizeOwnerEmail(email)
    return owner && owner !== "unknown" ? owner : ""
}

let sharedGroupSyncKeyFromParts = function(ownerKey, resourceName){
    let owner = normalizeOwnerEmail(ownerKey)
    let resource = String(resourceName || "").trim()
    if (!owner || !resource){
        return ""
    }
    return `shared:${owner}|${resource}`
}

let sharedGroupMatches = function(group, ownerKey, resourceName){
    if (!group){
        return false
    }
    return (
        sharedGroupOwnersCompatible(group.owner, ownerKey) &&
        String(group.resourceName || "").trim() === String(resourceName || "").trim()
    )
}

let sharedGroupSameAs = function(candidate, reference){
    if (!candidate || !reference){
        return false
    }
    let shareA = String(candidate.shareId || "").trim()
    let shareB = String(reference.shareId || "").trim()
    if (shareA && shareB && shareA === shareB){
        return true
    }
    let createdA = String(candidate.created || "").trim()
    let createdB = String(reference.created || "").trim()
    if (createdA && createdB && createdA === createdB){
        return true
    }
    if (sharedGroupMatches(candidate, reference.owner, reference.resourceName)){
        return true
    }
    let owner = dismissalOwnerKey(reference.owner)
    let name = String(reference.name || "").trim().toLowerCase()
    if (
        name &&
        String(candidate.name || "").trim().toLowerCase() === name &&
        sharedGroupOwnersCompatible(candidate.owner, reference.owner)
    ){
        return true
    }
    return false
}

let resolveSharedGroupIdentity = function(group){
    if (!group){
        return null
    }
    return {
        owner: String(group.owner || "").trim(),
        resourceName: String(group.resourceName || "").trim(),
        shareId: String(group.shareId || "").trim(),
        created: String(group.created || "").trim(),
        name: String(group.name || "").trim(),
    }
}

let sharedGroupHasRemovableIdentity = function(identity){
    if (!identity){
        return false
    }
    if (identity.shareId || identity.created){
        return true
    }
    if (identity.resourceName && (identity.owner || identity.name)){
        return true
    }
    if (identity.name){
        return true
    }
    return false
}

let sharedGroupDismissalKeys = function(group){
    if (!group){
        return []
    }
    let owner = dismissalOwnerKey(group.owner)
    let resource = String(group.resourceName || "").trim()
    let shareId = String(group.shareId || "").trim()
    let created = String(group.created || "").trim()
    let name = String(group.name || "").trim().toLowerCase()
    let keys = []
    if (created){
        keys.push(`created:${created}`)
    }
    if (shareId){
        keys.push(`share-id:${shareId}`)
        if (owner){
            keys.push(`share:${owner}|${shareId}`)
        } else {
            keys.push(`share:|${shareId}`)
        }
    }
    if (resource){
        if (owner){
            keys.push(`group:${owner}|${resource}`)
            keys.push(`shared:${owner}|${resource}`)
        } else {
            keys.push(`group:|${resource}`)
        }
    }
    if (name){
        keys.push(`name:${name}`)
        if (owner){
            keys.push(`name:${owner}|${name}`)
        }
    }
    return keys.filter((key, index, all)=> key && all.indexOf(key) === index)
}

let isSharedGroupDismissed = function(group, dismissedMap){
    if (!group || !dismissedMap || !Object.keys(dismissedMap).length){
        return false
    }
    return sharedGroupDismissalKeys(group).some(key=> dismissedMap[key])
}

let dismissSharedGroupLocally = function(vm, group){
    sharedGroupDismissalKeys(group).forEach(key=>{
        vm.$set(vm.dismissedSharedGroupKeys, key, true)
    })
}

let filterDismissedSharedGroups = function(groups, dismissedMap){
    if (!dismissedMap || !Object.keys(dismissedMap).length){
        return groups || []
    }
    return (groups || []).filter(group=> !isSharedGroupDismissed(group, dismissedMap))
}

let encodeMailtoValue = function(value){
    return encodeURIComponent(String(value || "")).replace(/%20/g, "%20")
}

let buildInviteUrl = function(baseUrl, recipientEmail){
    let base = String(baseUrl || `${window.location.origin}/?mode=shared`).trim()
    let email = String(recipientEmail || "").trim().toLowerCase()
    if (!email){
        return base
    }
    if (/([?&])email=/.test(base)){
        return base.replace(/([?&])email=[^&]*/, `$1email=${encodeURIComponent(email)}`)
    }
    return `${base}${base.includes("?") ? "&" : "?"}email=${encodeURIComponent(email)}`
}

let KEEP_PAGE_OPEN_PLAIN = "KEEP THIS PAGE OPEN until the contacts finish downloading."
let RETRY_IMPORT_PLAIN = "If you close the page or open another tab, use the Retry button to restart the import."

let inviteDisplayName = function(groupName, resourceName, appConfig){
    let googleName = String(groupName || "").trim()
    let settingsName = String((appConfig && appConfig.sharedContactsGroupName) || "").trim()
    let settingsResource = String((appConfig && appConfig.sharedContactsGroupResourceName) || "").trim()
    let resource = String(resourceName || "").trim()
    if (settingsName && settingsResource && resource === settingsResource){
        return settingsName
    }
    if (settingsName && googleName && settingsName.toLowerCase() === googleName.toLowerCase()){
        return settingsName
    }
    return googleName || settingsName
}

let openShareInviteMailto = function(ownerEmail, groupName, recipientEmails, inviteUrl){
    let recipients = (recipientEmails || []).map(email=>String(email || "").trim().toLowerCase()).filter(Boolean)
    if (!recipients.length){
        return false
    }
    let subject = "Share Google Contacts"
    let bodyLines = [
        "Hi,",
        "",
        `${ownerEmail} shared the contact group "${groupName}" with you.`,
        "",
    ]
    if (recipients.length === 1){
        bodyLines.push(
            "Open this link to import shared contacts (sign in with the Google account that received this email):",
            buildInviteUrl(inviteUrl, recipients[0]),
        )
    } else {
        bodyLines.push("Open your personal link below (sign in with the matching Google account):")
        recipients.forEach((email)=>{
            bodyLines.push("", `${email}:`, buildInviteUrl(inviteUrl, email))
        })
    }
    bodyLines.push("", KEEP_PAGE_OPEN_PLAIN, "", RETRY_IMPORT_PLAIN)
    let body = bodyLines.join("\n")
    let params = [
        `bcc=${encodeMailtoValue(recipients.join(","))}`,
        `subject=${encodeMailtoValue(subject)}`,
        `body=${encodeMailtoValue(body)}`,
    ]
    window.location.href = `mailto:?${params.join("&")}`
    return true
}

let parseSharedStatusFraction = function(status){
    let match = String(status || "").match(/\((\d+)\s*\/\s*(\d+)/)
    if (!match){
        return null
    }
    return {done: Number(match[1]), total: Number(match[2])}
}

let isSharedRecipientPrepStatus = function(status){
    status = String(status || "")
    return (
        status.startsWith("Ready (") ||
        status.startsWith("Ready to") ||
        status.startsWith("Waiting for owner sync")
    )
}

let parseSharedImportStatusFraction = function(status){
    if (isSharedRecipientPrepStatus(status)){
        return null
    }
    return parseSharedStatusFraction(status)
}

let formatSharedStatusLabel = function(group){
    let status = String((group && group.status) || "")
    if (!status){
        return "-"
    }
    if (status.startsWith("Shared (")){
        return status
    }
    if (status.startsWith("Photos")){
        return "Adding photos"
    }
    if (status.startsWith("Importing photos")){
        return "Adding photos"
    }
    if (status.startsWith("Importing")){
        return "Importing"
    }
    if (status.startsWith("Queued")){
        return "Queued"
    }
    if (status.startsWith("Pushing")){
        let match = status.match(/\((\d+\s*\/\s*\d+)\)/)
        return match ? `Pushing (${match[1]})` : "Pushing"
    }
    if (status.startsWith("Waiting for owner sync")){
        return "Waiting for owner sync"
    }
    if (status.startsWith("Connect account")){
        return "Connect account to import"
    }
    if (status.startsWith("Ready")){
        return "Ready to import"
    }
    if (status.startsWith("Shared")){
        return "Shared"
    }
    return status
}

let getSharedImportedCount = function(group){
    if (!group){
        return 0
    }
    let total = Number(group.memberCount || 0)
    let status = String(group.status || "")
    let parsed = parseSharedImportStatusFraction(status)
    let processed = Number(group.importCursor || 0)
    if (parsed){
        processed = Math.max(processed, parsed.done)
    }
    let actualCount = Number(group.actualCount || 0)
    let contactsPassComplete =
        (total > 0 && processed >= total) ||
        status.startsWith("Photos (") ||
        status.startsWith("Importing photos") ||
        group.importPhase === "photos" ||
        status.startsWith("Shared")
    if (contactsPassComplete && actualCount > 0){
        processed = Math.max(processed, actualCount)
    }
    let skipped = Number(group.skippedCount || 0)
    let imported = processed - skipped
    if (imported < 0){
        imported = 0
    }
    if (imported > total){
        imported = total
    }
    return imported
}

let resolveOwnerSyncCountLabel = function(group){
    if (!group){
        return ""
    }
    if (!group.shared || !group.shared.length){
        return ""
    }
    let statusText = String(group.status || "")
    if (
        statusText.startsWith("Synced") ||
        statusText.startsWith("Syncing") ||
        statusText.startsWith("Queued")
    ){
        let match = statusText.match(/(\d+)\s*\/\s*(\d+)/)
        if (match){
            return `${match[1]}/${match[2]}`
        }
    }
    let progress = group.syncProgress || {}
    let done = Number(progress.done || 0)
    let total = Number(progress.total || group.memberCount || 0)
    if (total > 0 && done > 0){
        if (done < 0){
            done = 0
        }
        if (done > total){
            done = total
        }
        return `${done}/${total}`
    }
    return ""
}

let isSharedGroupPending_ = function(group){
    if (!group){
        return false
    }
    let status = String(group.status || "")
    if (status.startsWith("Error")){
        return false
    }
    if (status.startsWith("Waiting for owner sync")){
        return false
    }
    if (status.startsWith("Ready (") || status.startsWith("Ready to")){
        return false
    }
    if (status.startsWith("Pushing")){
        return true
    }
    if (status.startsWith("Photos (")){
        if (sharedPhotosComplete_(group)){
            return false
        }
        return true
    }
    let photoPending = group.photoPendingIndexes || []
    let photoRetry = group.photoRetryIndexes || []
    if (photoPending.length || photoRetry.length){
        return true
    }
    let retryIndexes = group.retryIndexes || []
    if (retryIndexes.length){
        return true
    }
    if (status.startsWith("Shared")){
        if (isSharedPhotoPhase_(group)){
            return true
        }
        return false
    }
    if (status.startsWith("Importing photos")){
        return true
    }
    if (status.startsWith("Importing") || status.startsWith("Queued")){
        return true
    }
    let total = Number(group.memberCount || 0)
    let cursor = Number(group.importCursor || 0)
    let parsed = parseSharedImportStatusFraction(status)
    if (parsed){
        cursor = Math.max(cursor, parsed.done)
    }
    return total > 0 && cursor < total
}

let sharedGroupServerPushLikelyActive_ = function(group){
    if (!group){
        return false
    }
    let status = String(group.status || "")
    if (
        status.startsWith("Pushing") ||
        status.startsWith("Importing") ||
        status.startsWith("Queued")
    ){
        return true
    }
    if (status.startsWith("Photos (") || status.startsWith("Importing photos")){
        return true
    }
    return group.importPhase === "photos"
}

let sharedGroupNeedsPhotoImport_ = function(group){
    if (!group){
        return false
    }
    if (group.importPhase === "photos"){
        return true
    }
    let status = String(group.status || "")
    if (status.startsWith("Photos (") || status.startsWith("Importing photos")){
        return true
    }
    return shouldShowSharedPhotoProgress_(group)
}

let getSharedPhotoProgress = function(group){
    if (!group){
        return {photoDone: 0, photoTotal: 0, photoRemaining: 0}
    }
    let status = String(group.status || "")
    let match = status.match(/Photos\s*\((\d+)\s*\/\s*(\d+)/)
    let photoDone = Number(group.photoDoneCount || 0)
    let photoPending = Number(group.photoPendingCount || 0)
    if (!photoPending){
        photoPending = (group.photoPendingIndexes || []).length
    }
    let photoRetry = (group.photoRetryIndexes || []).length
    if (match){
        photoDone = Math.max(photoDone, Number(match[1]))
    }
    let photoTargetCount = Number(group.photoTargetCount || 0)
    if (!photoTargetCount){
        let targetKeys = Object.keys(group.photoTargets || {}).length
        if (targetKeys > 0){
            photoTargetCount = targetKeys
        }
    }
    let photoTotal = photoTargetCount
    if (!photoTotal && match){
        photoTotal = Number(match[2])
    }
    if (!photoTotal){
        photoTotal = photoDone + photoPending + photoRetry
    }
    return {
        photoDone,
        photoTotal,
        photoRemaining: photoPending + photoRetry,
    }
}

let sharedPhotosComplete_ = function(group){
    if (!group){
        return false
    }
    if (String(group.status || "").startsWith("Shared")){
        return true
    }
    let photo = getSharedPhotoProgress(group)
    return photo.photoTotal > 0 && photo.photoDone >= photo.photoTotal
}

let contactsImportComplete_ = function(group){
    if (!group){
        return false
    }
    let memberTotal = Number(group.memberCount || 0)
    if (memberTotal <= 0){
        return false
    }
    let status = String(group.status || "")
    if (
        status.startsWith("Ready (") ||
        status.startsWith("Ready to") ||
        status.startsWith("Waiting for owner sync")
    ){
        return false
    }
    let cursor = Number(group.importCursor || 0)
    if (cursor >= memberTotal){
        return true
    }
    if (
        status.startsWith("Importing") ||
        status.startsWith("Photos (") ||
        status.startsWith("Importing photos") ||
        status.startsWith("Shared")
    ){
        let parsed = parseSharedImportStatusFraction(status)
        return !!(parsed && parsed.done >= memberTotal)
    }
    return false
}

let shouldShowSharedPhotoProgress_ = function(group){
    if (!group){
        return false
    }
    if (group.importPhase === "photos"){
        return true
    }
    if (isSharedPhotoPhase_(group)){
        return true
    }
    if (!contactsImportComplete_(group)){
        return false
    }
    let photoTarget = Number(group.photoTargetCount || 0)
    let photoDone = Number(group.photoDoneCount || 0)
    if (photoTarget > 0 && photoDone < photoTarget){
        return true
    }
    let photoPending = Number(group.photoPendingCount || 0)
    if (!photoPending){
        photoPending = (group.photoPendingIndexes || []).length
    }
    return photoPending > 0
}

let isSharedPhotoPhase_ = function(group){
    if (!group){
        return false
    }
    let status = String(group.status || "")
    if (status.startsWith("Photos (") || status.startsWith("Importing photos")){
        return true
    }
    if (group.importPhase === "photos"){
        return true
    }
    let memberTotal = Number(group.memberCount || 0)
    let cursor = Number(group.importCursor || 0)
    let contactsDone = memberTotal > 0 && cursor >= memberTotal
    if (!contactsDone && !isSharedRecipientPrepStatus(status)){
        let parsed = parseSharedImportStatusFraction(status)
        if (parsed && memberTotal > 0 && parsed.done >= memberTotal){
            contactsDone = true
        }
    }
    if (!contactsDone){
        return false
    }
    let photoDone = Number(group.photoDoneCount || 0)
    let targetCount = Number(group.photoTargetCount || 0)
    if (!targetCount){
        targetCount = Object.keys(group.photoTargets || {}).length
    }
    if (targetCount > 0 && photoDone < targetCount){
        return true
    }
    let photoPending = (group.photoPendingIndexes || []).length
    let photoRetry = (group.photoRetryIndexes || []).length
    if (photoPending || photoRetry){
        return true
    }
    let photo = getSharedPhotoProgress(group)
    if (photo.photoRemaining > 0){
        return true
    }
    if (photo.photoTotal > 0 && photo.photoDone < photo.photoTotal){
        return true
    }
    return false
}

let buildSharedImportProgress = function(group, isActive){
    if (!group){
        return {
            pending: false,
            active: false,
            phase: "idle",
            done: 0,
            total: 0,
            percent: 0,
            label: "-",
        }
    }

    let total = Number(group.memberCount || 0)
    let status = String(group.status || "")
    if (status.startsWith("Waiting for owner sync")){
        return {
            pending: false,
            active: false,
            phase: "waiting",
            done: 0,
            total,
            percent: 0,
            label: "Waiting for owner sync",
        }
    }
    let active = !!isActive

    if (group.importPhase === "photos" || shouldShowSharedPhotoProgress_(group)){
        if (sharedPhotosComplete_(group)){
            return {
                pending: false,
                active: false,
                phase: "done",
                done: Number(group.memberCount || 0),
                total: Number(group.memberCount || 0),
                photoDone: getSharedPhotoProgress(group).photoDone,
                photoTotal: getSharedPhotoProgress(group).photoTotal,
                percent: 100,
                label: "Shared",
                detail: "Import complete",
            }
        }
        let photo = getSharedPhotoProgress(group)
        let photoDone = photo.photoDone
        let photoTotal = photo.photoTotal
        return {
            pending: true,
            active,
            phase: "photos",
            done: Number(group.memberCount || 0),
            total: Number(group.memberCount || 0),
            photoDone,
            photoTotal,
            percent: photoTotal > 0 ? Math.min(100, Math.round((photoDone / photoTotal) * 100)) : 0,
            label: active ? "Adding photos" : "Photos remaining",
            detail: `Contacts imported · Photos ${photoDone}/${photoTotal}`,
        }
    }

    let done = getSharedImportedCount(group)
    let pending = isSharedGroupPending_(group)

    if (!pending && !active){
        return {
            pending: false,
            active: false,
            phase: status.startsWith("Shared") ? "done" : "idle",
            done,
            total,
            percent: total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 100,
            label: formatSharedStatusLabel(group),
        }
    }

    let phase = status.startsWith("Queued") ? "queued" : "importing"
    let label = "Importing contacts"
    if (phase === "queued"){
        label = active ? "Starting import" : "Queued"
    }

    return {
        pending: true,
        active,
        phase,
        done,
        total,
        percent: total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0,
        label,
    }
}

let reconcileOwnerSyncRequiredMessage = function(){
    if (!this.ownerSyncRequiredMessage){
        return
    }
    let sharedGroupsNeedingSync = (this.groupsList || []).filter(group=>{
        let shared = group && group.shared
        if (!Array.isArray(shared) || !shared.length){
            return false
        }
        let status = String(group.status || "")
        return !(status.startsWith("Synced") || status.startsWith("Ready"))
    })
    if (!sharedGroupsNeedingSync.length){
        this.ownerSyncRequiredMessage = ""
    }
}

let clearOwnerShareNotices = function(options){
    let keepSyncStatus = options && options.keepSyncStatus
    this.shareStatusMessage = ""
    this.shareStatusIsError = false
    this.ownerSyncRequiredMessage = ""
    if (!keepSyncStatus){
        this.syncStatusMessage = ""
    }
}
    
    let data = {
        popupData,
        isLoading: true,
        hasLoadError: false,
        error: "",
        profile: { displayName: "", email: "" },
        isSharing: false,
        syncingGroups: {},
        activeOwnerSyncResourceName: "",
        groupsById: {},
        groupsList: [],
        recipientConnected: false,
        sharedImportProgressByKey: {},
        sharedImportProgressTick: 0,
        syncStatusMessage: "",
        ownerSyncPollErrors: {},
        ownerSyncLabels: {},
        ownerProgressProbeAt: {},
        ownerSyncInFlight: {},
        shareStatusMessage: "",
        shareStatusIsError: false,
        ownerSyncRequiredMessage: "",
        skippedDialog: {
            groupName: "",
            contacts: [],
            loading: false,
            error: "",
        },
        viewMode: window.VIEW_MODE || "owner",
        inviteRecipientEmail: String(window.INVITE_RECIPIENT_EMAIL || "").trim().toLowerCase(),
        sendShareEmailsEnabled: false,
        inviteUrl: "",
        sharedContactsGroupName: "",
        sharedContactsGroupResourceName: "",
        syncConfirm: {
            resourceName: "",
            groupName: ""
        },
        resetConfirm: {
            resourceName: "",
            groupName: "",
            message: ""
        },
        dismissConfirm: {
            groupName: "",
            groupSnapshot: null,
            identity: null,
        },
        pendingDismissGroup: null,
        sharedGroups: [],
        dismissedSharedGroupKeys: {}
    }
    
    let resetPopupData = function(data){
        this.popupData = data
        if (typeof this.popupData.notifyByEmail !== "boolean"){
            this.popupData.notifyByEmail = true
        }
        
        // initialize share email chip
        let elem = document.querySelector('.chip-share-emails')
        options = {
            placeholder: "Add email"
        }
        M.Chips.init(elem, options)
    }
    
    let shareContactGroup = function(){
        if (this.isSharing){
            return
        }
        let elem = document.querySelector('.chip-share-emails')
        let chip = M.Chips.getInstance(elem)
        // Ensure current input value becomes a chip before reading chipsData
        let input = elem ? elem.querySelector("input") : null
        if (input && input.value && input.value.trim()){
            let value = input.value.toLowerCase().trim()
            let exists = chip && chip.chipsData.some(c=>c.tag.toLowerCase().trim() === value)
            if (chip && !exists){
                chip.addChip({tag: value})
            }
            input.value = ""
        }
        let rawEmails = chip ? chip.chipsData.map(chip=>chip.tag.toLowerCase().trim()) : []
        let emails = rawEmails.slice()
        
        let key = this.profile.email
        let shared = this.popupData.shared
        let resourceName = this.popupData.resourceName
        let name = this.popupData.name
        let memberCount = this.popupData.memberCount
        let members = this.popupData.members
        let notifyByEmail = this.popupData.notifyByEmail !== false
        let latestShared = (
            this.groupsById &&
            this.groupsById[resourceName] &&
            Array.isArray(this.groupsById[resourceName].shared)
        ) ? this.groupsById[resourceName].shared : shared
        let sharedSet = new Set((latestShared || []).map(email=>String(email || "").trim().toLowerCase()))
        
        emails = emails.filter(email=>!sharedSet.has(String(email || "").trim().toLowerCase()))
        
        if (emails.length){
            let call = window.appCall
            if (typeof call !== "function"){
                this.shareStatusIsError = true
                this.shareStatusMessage = "App API bridge failed to load. Hard refresh the page."
                return
            }
            this.isSharing = true
            this.shareStatusMessage = ""
            this.shareStatusIsError = false
            call("shareContactGroup", [key, resourceName, name, members, memberCount, emails, notifyByEmail])
                .then((result)=>{
                    let groups = result && result.groups
                    let shareStatus = result && result.shareStatus
                    let nextGroups = Object.assign({}, this.groupsById || {})
                    if (groups){
                        Object.keys(groups).forEach(id=>{
                            let existing = nextGroups[id] || {}
                            let incoming = groups[id] || {}
                            nextGroups[id] = Object.assign({}, existing, incoming)
                        })
                    }
                    this.groupsById = nextGroups
                    this.groupsList = Object.values(nextGroups).sort((a, b) => (a.name || "").localeCompare((b.name || ""), undefined, {sensitivity: "base"}))
                    if (nextGroups[resourceName] && nextGroups[resourceName].shared){
                        this.popupData.shared = nextGroups[resourceName].shared
                    }
                    let sent = shareStatus && shareStatus.sent ? shareStatus.sent : 0
                    let notified = shareStatus && typeof shareStatus.notified === "number" ? shareStatus.notified : (notifyByEmail ? sent : 0)
                    let blockedNoInvite = shareStatus && shareStatus.blockedNoInvite ? shareStatus.blockedNoInvite : 0
                    let blockedNoInviteEmails = (shareStatus && Array.isArray(shareStatus.blockedNoInviteEmails))
                        ? shareStatus.blockedNoInviteEmails
                        : []
                    let requiresOwnerSync = !!(shareStatus && shareStatus.requiresOwnerSync)
                    if (!requiresOwnerSync && sent > 0){
                        requiresOwnerSync = true
                    }
                    let requestedContacts = shareStatus && shareStatus.requestedContacts ? shareStatus.requestedContacts : 0
                    let preparedContacts = shareStatus && shareStatus.preparedContacts ? shareStatus.preparedContacts : 0
                    let missingContacts = shareStatus && shareStatus.missingContacts ? shareStatus.missingContacts : 0
                    if (sent <= 0){
                        this.shareStatusIsError = true
                        if (blockedNoInvite > 0){
                            let blockedList = blockedNoInviteEmails.length
                                ? blockedNoInviteEmails.join(", ")
                                : `${blockedNoInvite} recipient(s)`
                            this.shareStatusMessage = `No recipients were added. Not added (no prior invite): ${blockedList}. Turn on email notification for first-time shares, or share again with the checkbox enabled.`
                        } else {
                            this.shareStatusMessage = "No recipients were added."
                        }
                    } else {
                        this.shareStatusMessage = `Shared with ${sent} recipient(s). Prepared ${preparedContacts}/${requestedContacts} contact(s).`
                        if (notifyByEmail){
                            if (this.sendShareEmailsEnabled){
                                this.shareStatusMessage += ` Email sent to ${notified} recipient(s).`
                            } else if (openShareInviteMailto(
                                key,
                                (shareStatus && shareStatus.inviteGroupName) || inviteDisplayName(name, resourceName, this),
                                emails,
                                this.inviteUrl
                            )){
                                this.shareStatusMessage += " Your email app should open with the invite — click Send."
                            } else {
                                this.shareStatusMessage += " Email notification skipped — send the invite link manually."
                            }
                        } else {
                            this.shareStatusMessage += " Email notification skipped — send the invite link manually."
                        }
                        let hasShareWarning = false
                        if (blockedNoInvite > 0){
                            let blockedList = blockedNoInviteEmails.length
                                ? blockedNoInviteEmails.join(", ")
                                : `${blockedNoInvite} recipient(s)`
                            let inviteUrl = this.inviteUrl || `${window.location.origin}/?mode=shared`
                            this.shareStatusMessage += ` Reminder: send ${blockedList} the invite link: ${inviteUrl}`
                        }
                        if (requiresOwnerSync){
                            this.ownerSyncRequiredMessage = `"${name}" was shared. Click Sync to push contacts to recipients.`
                        }
                        this.shareStatusIsError = (missingContacts > 0) || hasShareWarning
                        if (missingContacts > 0){
                            this.shareStatusMessage += ` ${missingContacts} contact(s) could not be prepared.`
                        }
                    }
                    if (M && M.toast){
                        M.toast({html: this.shareStatusMessage})
                        if (requiresOwnerSync && sent > 0){
                            M.toast({html: "Group shared. Now click Sync to send contacts.", classes: "amber darken-2"})
                        }
                    }
                    try {
                        if (chip && typeof chip.deleteChip === "function"){
                            while (chip.chipsData && chip.chipsData.length){
                                chip.deleteChip(0)
                            }
                        }
                    } catch (chipErr){
                        console.warn("Could not clear share chips:", chipErr)
                    }
                })
                .catch((error)=>{
                    this.shareStatusIsError = true
                    this.ownerSyncRequiredMessage = ""
                    this.shareStatusMessage = formatClientError(error)
                    if (M && M.toast){
                        M.toast({html: this.shareStatusMessage})
                    }
                })
                .finally(()=>{
                    this.isSharing = false
                })
        } else {
            this.shareStatusIsError = true
            if (rawEmails.length > 0){
                this.shareStatusMessage = "All entered emails are already collaborators for this group."
            } else {
                this.shareStatusMessage = "Enter at least one new recipient email."
            }
        }
    }
    
    
    let stopShareContactGroup = function(key, email, resourceName){
        let call = window.appCall
        if (typeof call !== "function"){
            if (M && M.toast){
                M.toast({html: "App API failed to load. Hard refresh the page."})
            }
            return
        }
        call("stopShareContactGroup", [key, email, resourceName])
            .then((result)=>{
                let groups = result && result.groups
                let nextGroups = Object.assign({}, this.groupsById || {})
                if (groups){
                    Object.keys(groups).forEach(id=>{
                        let existing = nextGroups[id] || {}
                        let incoming = groups[id] || {}
                        nextGroups[id] = Object.assign({}, existing, incoming)
                    })
                }
                this.groupsById = nextGroups
                this.groupsList = Object.values(nextGroups).sort((a, b) => (a.name || "").localeCompare((b.name || ""), undefined, {sensitivity: "base"}))
                if (nextGroups[resourceName]){
                    let updatedGroup = nextGroups[resourceName]
                    this.popupData.shared = updatedGroup.shared || []
                    if (!updatedGroup.shared || !updatedGroup.shared.length){
                        if (this.ownerSyncLabels[resourceName]){
                            this.$delete(this.ownerSyncLabels, resourceName)
                        }
                        delete updatedGroup.syncProgress
                        delete updatedGroup.status
                        clearOwnerShareNotices.call(this)
                    } else {
                        this.shareStatusMessage = ""
                        this.shareStatusIsError = false
                        reconcileOwnerSyncRequiredMessage.call(this)
                    }
                } else {
                    clearOwnerShareNotices.call(this)
                }
                if (M && M.toast){
                    M.toast({html: `Removed ${email} from this group.`})
                }
            })
            .catch((error)=>{
                if (M && M.toast){
                    M.toast({html: formatClientError(error)})
                }
            })
    }
    
    
    let refreshAppData = function(options){
        options = options || {}
        let recover = !!options.recover
        let call = window.appCall
        if (typeof call !== "function"){
            return
        }
        call("loadApp", [this.viewMode, recover])
            .then((result)=>{
                this.isLoading = false
                this.hasLoadError = false
                this.profile = result.profile || this.profile
                this.groupsById = result.groups || {}
                this.groupsList = Object.values(this.groupsById).sort((a, b) => (a.name || "").localeCompare((b.name || ""), undefined, {sensitivity: "base"}))
                this.sharedGroups = filterDismissedSharedGroups(
                    result.sharedGroups || [],
                    this.dismissedSharedGroupKeys
                )
                this.recipientConnected = !!result.recipientConnected
                this.sharedGroups.forEach((group)=>{
                    this.updateSharedImportProgressUi(group)
                    this.ensureSharedImportProgressPoll(group)
                })
                this.seedOwnerSyncLabelsFromGroups()
                reconcileOwnerSyncRequiredMessage.call(this)
                if (this.viewMode === "shared" && this.recipientConnected){
                    this.$nextTick(()=>{
                        this.resumePendingSharedImports()
                    })
                }
            })
            .catch((error)=>{
                this.isLoading = false
                this.hasLoadError = true
                this.error = formatClientError(error)
            })
    }

    let refreshSharedPage = function(){
        this.isLoading = true
        refreshAppData.call(this, {recover: true})
    }
    
    let methods = {
        resetPopupData,

            }
            let cb = this.popupData && this.popupData.callback

                cb.call(this)
            }
        },
        formatSharedStatusLabel,
        getSharedImportedCount,
        getSharedImportProgress: function(group){
            void this.sharedImportProgressTick
            if (!group){
                return buildSharedImportProgress(group, false)
            }
            let active = this.isSharedGroupSyncing(group) || isSharedGroupPending_(group)
            return buildSharedImportProgress(group, active)
        },
        getSharedImportProgressCount: function(group){

            if (this.sharedShowPhotoBar(group)){

            }
            let progress = this.getSharedImportProgress(group)
            if (progress.phase === "photos"){

        sharedImportBusy: function(group){

        },
        sharedShowPhotoBar: function(group){
            void this.sharedImportProgressTick
            if (!group){
                return false
            }
            let status = String(group.status || "")
            if (isSharedRecipientPrepStatus(status)){
                return false
            }
            if (status.startsWith("Shared")){
                return false
            }
            if (
                contactsImportComplete_(group)
                && !sharedPhotosComplete_(group)
            ){
                return true
            }
            if (status.startsWith("Photos (") || status.startsWith("Importing photos")){
                return true
            }
            if (group.importPhase === "photos"){
                return true
            }

        sharedContactCountLabel: function(group){
            void this.sharedImportProgressTick
            let total = Number(group.memberCount || 0)
            let done = Number(group.importCursor || 0)
            let parsed = parseSharedImportStatusFraction(group.status)
            if (parsed){
                done = Math.max(done, parsed.done)
            }
            if (this.isSharedGroupSyncing(group)){
                done = Math.max(done, Number(group.actualCount || 0))
            }
            if (done > total){
                done = total
            }
            return `${done}/${total}`
        },
        sharedPhotoCountLabel: function(group){
            void this.sharedImportProgressTick
            let target = Number(group.photoTargetCount || 0)
            let done = Number(group.photoDoneCount || 0)
            let match = String(group.status || "").match(/Photos\s*\((\d+)\s*\/\s*(\d+)/)
            if (match){
                done = Math.max(done, Number(match[1]))
                if (!target){
                    target = Number(match[2])
                }
            }
            if (!target){
                target = Number(group.memberCount || 0)
            }
            if (target > 0){
                done = Math.min(done, target)
            }
            return `${done}/${target} photos`
        },
        sharedContactPercent: function(group){
            void this.sharedImportProgressTick
            let total = Number(group.memberCount || 0)
            if (total <= 0){
                return 0
            }
            let done = Number(group.importCursor || 0)
            let parsed = parseSharedImportStatusFraction(group.status)
            if (parsed){
                done = Math.max(done, parsed.done)
            }
            if (this.isSharedGroupSyncing(group)){
                done = Math.max(done, Number(group.actualCount || 0))
            }
            if (done > total){
                done = total
            }
            return Math.min(100, Math.round((done / total) * 100))
        },
        sharedPhotoPercent: function(group){
            void this.sharedImportProgressTick
            let target = Number(group.photoTargetCount || 0)
            let done = Number(group.photoDoneCount || 0)
            let match = String(group.status || "").match(/Photos\s*\((\d+)\s*\/\s*(\d+)/)
            if (match){
                done = Math.max(done, Number(match[1]))
                if (!target){
                    target = Number(match[2])
                }
            }
            if (!target){
                target = Number(group.memberCount || 0)
            }
            if (target <= 0){
                return 0
            }
            done = Math.min(done, target)
            return Math.min(100, Math.round((done / target) * 100))
        },
        updateSharedImportProgressUi: function(group){
            let key = this.getSharedGroupSyncKey(group)
            if (!key || !group){
                return
            }
            let active = this.isSharedGroupSyncing(group) || isSharedGroupPending_(group)
            this.$set(
                this.sharedImportProgressByKey,
                key,
                buildSharedImportProgress(group, active)
            )
            this.sharedImportProgressTick = (this.sharedImportProgressTick || 0) + 1
        },
        applySharedGroupUpdate: function(ownerKey, resourceName, sharedGroups){
            let groups = filterDismissedSharedGroups(sharedGroups || [], this.dismissedSharedGroupKeys)
            let latest = groups.find(item=> sharedGroupMatches(item, ownerKey, resourceName))
            let targetIndex = this.sharedGroups.findIndex(item=>
                sharedGroupMatches(item, ownerKey, resourceName)
            )
            if (!latest){
                if (targetIndex >= 0){
                    this.sharedGroups.splice(targetIndex, 1)
                }
                return null
            }
            if (targetIndex >= 0){
                let merged = Object.assign({}, this.sharedGroups[targetIndex] || {}, latest)
                this.$set(this.sharedGroups, targetIndex, merged)
                this.updateSharedImportProgressUi(merged)
                let syncKey = this.getSharedGroupSyncKey(merged)
                if (syncKey && !isSharedGroupPending_(merged)){
                    this.$set(this.syncingGroups, syncKey, false)
                    this.stopSharedImportProgressPoll(syncKey)
                }
            } else if (!isSharedGroupDismissed(latest, this.dismissedSharedGroupKeys)){
                this.sharedGroups.push(latest)
                this.updateSharedImportProgressUi(latest)
                let syncKey = this.getSharedGroupSyncKey(latest)
                if (syncKey && !isSharedGroupPending_(latest)){
                    this.$set(this.syncingGroups, syncKey, false)
                    this.stopSharedImportProgressPoll(syncKey)
                }
            }
            return targetIndex >= 0 ? this.sharedGroups[targetIndex] : latest
        },
        mergeSharedGroupFromServer: function(ownerKey, resourceName, sharedGroups){
            this.applySharedGroupUpdate(ownerKey, resourceName, sharedGroups)
            this.$nextTick(()=>{
                this.$forceUpdate()
            })
        },
        ensureSharedImportProgressPoll: function(group){
            if (!group || !group.owner || !group.resourceName){
                return
            }
            if (!isSharedGroupPending_(group)){
                return
            }
            let syncKey = this.getSharedGroupSyncKey(group)
            if (!syncKey){
                return
            }
            if (this._sharedImportPollers && this._sharedImportPollers[syncKey]){
                return
            }
            this.startSharedImportProgressPoll(syncKey, group.owner, group.resourceName)
        },
        startSharedImportProgressPoll: function(syncKey, ownerKey, resourceName){
            this.stopSharedImportProgressPoll(syncKey)
            if (!this._sharedImportPollers){
                this._sharedImportPollers = {}
            }
            let tick = ()=>{
                let call = window.appCall
                if (typeof call !== "function"){
                    return
                }
                call("getRecipientSharedGroups", [])
                    .then(({sharedGroups})=>{
                        this.mergeSharedGroupFromServer(ownerKey, resourceName, sharedGroups)
                    })
                    .catch(()=>{})
            }
            this._sharedImportPollers[syncKey] = setInterval(tick, 250)
            tick()
        },
        stopSharedImportProgressPoll: function(syncKey){
            if (this._sharedImportPollers && this._sharedImportPollers[syncKey]){
                clearInterval(this._sharedImportPollers[syncKey])
                delete this._sharedImportPollers[syncKey]
            }
        },
        resumePendingSharedImports: function(){
            if (this.viewMode !== "shared" || !this.recipientConnected){
                return
            }
            (this.sharedGroups || []).forEach((group)=>{
                if (group && isSharedGroupPending_(group)){
                    this.ensureSharedImportProgressPoll(group)
                }
            })
        },
        startRecipientImportWatcher: function(){
            if (this.viewMode !== "shared"){
                return
            }
            this.stopRecipientImportWatcher()
            this._recipientImportWatcher = setInterval(()=>{
                if (!this.recipientConnected || this.isLoading){
                    return
                }
                this.resumePendingSharedImports()
            }, 4000)
        },
        stopRecipientImportWatcher: function(){
            if (this._recipientImportWatcher){
                clearInterval(this._recipientImportWatcher)
                this._recipientImportWatcher = null
            }
        },
        shareContactGroup,
        stopShareContactGroup,
        getSharedGroupSyncKey: function(group){
            if (!group){
                return ""
            }
            return sharedGroupSyncKeyFromParts(group.owner, group.resourceName)
        },
        sharedGroupRowKey: function(group, index){
            let base = this.getSharedGroupSyncKey(group)

            }

        bindSharedGroupsTableActions: function(){

        bindDismissModalActions: function(){

            }
            let confirmBtn = document.getElementById("btn-confirm-dismiss-shared")

        stopAllSharedImportPolls: function(){
            if (!this._sharedImportPollers){
                return
            }
            Object.keys(this._sharedImportPollers).forEach((syncKey)=>{
                this.stopSharedImportProgressPoll(syncKey)
            })

        openDismissSharedModal: function(){

            if (typeof M === "undefined" || !M || !M.Modal || !modalElem){
                return null
            }
            let modal = M.Modal.getInstance(modalElem)
            if (!modal){
