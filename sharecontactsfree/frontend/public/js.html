        },
        promptDismissSharedGroup: function(indexOrGroup){
            let index = (typeof indexOrGroup === "number") ? indexOrGroup : -1
            let group = (index >= 0)
                ? (this.sharedGroups || [])[index]
                : indexOrGroup
            if (!group){
                notifyUser("Cannot dismiss — row not found. Refresh and try again.", "red darken-2")
                return
            }
            let identity = resolveSharedGroupIdentity(group)
            if (!sharedGroupHasRemovableIdentity(identity)){
                notifyUser(
                    "Cannot dismiss this row — group metadata is missing. Try Refresh, then dismiss again.",
                    "red darken-2"
                )
                return
            }
            let pending = {
                index: index,
                groupSnapshot: Object.assign({}, group),
                identity: identity,
            }
            this.pendingDismissGroup = pending
            this.dismissConfirm = {
                groupName: identity.name || "this group",
                groupSnapshot: pending.groupSnapshot,
                identity: identity,
            }
            let modal = this.openDismissSharedModal()
            if (modal){
                modal.open()
                return
            }
            this.confirmDismissSharedGroup()
        },
        confirmDismissSharedGroup: function(){
            let pending = this.pendingDismissGroup
            let group = pending && pending.groupSnapshot
            let identity = pending && pending.identity
            if (!group || !identity){
                notifyUser("Dismiss failed — row data was lost. Refresh the page and try again.", "red darken-2")
                return
            }
            let modal = this.openDismissSharedModal()
            if (modal){
                modal.close()
            }
            this.performDismissSharedGroup(group, identity, pending.index)
        },
        removeSharedGroupFromList: function(group, index){
            if (typeof index === "number" && index >= 0 && index < (this.sharedGroups || []).length){
                let at = (this.sharedGroups || [])[index]
                if (at && sharedGroupSameAs(at, group)){
                    this.sharedGroups.splice(index, 1)
                    return true
                }
            }
            let before = (this.sharedGroups || []).length
            this.sharedGroups = (this.sharedGroups || []).filter(item=> !sharedGroupSameAs(item, group))
            return this.sharedGroups.length < before
        },
        performDismissSharedGroup: function(group, identity, index){
            let call = window.appCall
            if (typeof call !== "function"){
                notifyUser("App API failed to load. Hard refresh the page.", "red darken-2")
                return
            }
            let dismissedGroup = Object.assign({}, group)
            dismissSharedGroupLocally(this, group)
            let removed = this.removeSharedGroupFromList(group, index)
            this.stopAllSharedImportPolls()
            let syncKey = this.getSharedGroupSyncKey(group)
            if (syncKey){
                this.$delete(this.syncingGroups, syncKey)
            }
            call("dismissSharedRecipientGroup", [
                identity.owner,
                identity.resourceName,
                identity.shareId,
                identity.created,
                identity.name,
            ])
                .then((result)=>{
                    if (Array.isArray(result?.dismissedSharedGroups)){
                        result.dismissedSharedGroups.forEach((key)=>{
                            let normalized = String(key || "").trim()
                            if (normalized){
                                this.$set(this.dismissedSharedGroupKeys, normalized, true)
                            }
                        })
                    }
                    let next = Array.isArray(result?.sharedGroups)
                        ? result.sharedGroups
                        : (this.sharedGroups || [])
                    next = filterDismissedSharedGroups(next, this.dismissedSharedGroupKeys)
                    next = next.filter(item=> !sharedGroupSameAs(item, dismissedGroup))
                    this.sharedGroups = next
                    this.pendingDismissGroup = null
                    notifyUser("Group dismissed from your list.", "green darken-1")
                })
                .catch((error)=>{
                    this.pendingDismissGroup = null
                    notifyUser(formatClientError(error), "red darken-2")
                })
        },
        dismissSharedRecipientGroup: function(indexOrGroup){
            this.promptDismissSharedGroup(indexOrGroup)
        },
        removeRecipientSharedGroup: function(indexOrGroup){
            this.promptDismissSharedGroup(indexOrGroup)
        },
        isSharedGroupSyncing: function(group){
            let key = this.getSharedGroupSyncKey(group)
            return !!(key && this.syncingGroups && this.syncingGroups[key])
        },
        syncSharedRecipientGroup: function(group, options){
            options = options || {}
            let manual = options.manual !== false
            if (!group || !group.owner || !group.resourceName){
                return
            }
            if (!this.recipientConnected){
                if (typeof M !== "undefined" && M && M.toast){
                    M.toast({html: "Connect account first, then retry push.", classes: "amber darken-2"})
                }
                this.connectAccount()
                return
            }
            let call = window.appCall
            if (typeof call !== "function"){
                if (typeof M !== "undefined" && M && M.toast){
                    M.toast({html: "App API failed to load. Hard refresh the page."})
                }
                return
            }
            let syncKey = this.getSharedGroupSyncKey(group)
            if (!syncKey){
                return
            }
            let status = String(group.status || "")
            if (
                sharedGroupNeedsPhotoImport_(group) ||
                (
                    sharedGroupServerPushLikelyActive_(group) &&
                    !status.startsWith("Ready")
                )
            ){
                this.ensureSharedImportProgressPoll(group)
                if (manual && typeof M !== "undefined" && M && M.toast){
                    M.toast({
                        html: "Import already running — watch the progress bar.",
                        classes: "blue-grey darken-1",
                    })
                }
                return
            }
            if (
                status.startsWith("Pushing") ||
                status.startsWith("Ready") ||
                status.startsWith("Waiting for recipient")
            ){
                this.retrySharePush(group, {manual: manual})
                return
            }
            if (this.isSharedGroupSyncing(group)){
                this.ensureSharedImportProgressPoll(group)
                return
            }
            if (!this._sharedImportInFlight){
                this._sharedImportInFlight = {}
            }
            this.$set(this.syncingGroups, syncKey, true)
            if (!this._sharedImportStartedAt){
                this._sharedImportStartedAt = {}
            }
            this._sharedImportStartedAt[syncKey] = Date.now()
            let ownerKey = group.owner
            let resourceName = group.resourceName
            this.ensureSharedImportProgressPoll(group)
            let startedWithPending = isSharedGroupPending_(group)
            let runStep = () => {
                if (this._sharedImportInFlight[syncKey]){
                    return
                }
                this._sharedImportInFlight[syncKey] = true
                call("processSharedImportForGroup", [ownerKey, resourceName, 200])
                    .then(({sharedGroups, busy})=>{
                        let latest = this.applySharedGroupUpdate(ownerKey, resourceName, sharedGroups)
                        if (latest && isSharedGroupPending_(latest)){
                            let delay = busy ? 800 : 300
                            setTimeout(runStep, delay)
                            return
                        }
                        this.stopSharedImportProgressPoll(syncKey)
                        this.$set(this.syncingGroups, syncKey, false)
                        if (this._sharedImportStartedAt){
                            delete this._sharedImportStartedAt[syncKey]
                        }
                        let latestTotal = Number((latest && latest.memberCount) || 0)
                        let latestImported = latest ? getSharedImportedCount(latest) : 0
                        if (latest && !isSharedGroupPending_(latest) && latestTotal > 0 && latestImported >= latestTotal){
                            if (typeof M !== "undefined" && M && M.toast){
                                M.toast({html: startedWithPending ? "Import complete." : "Import up to date.", classes: "green darken-1"})
                            }
                        }
                    })
                    .catch((error)=>{
                        this.stopSharedImportProgressPoll(syncKey)
                        let message = formatClientError(error)
                        if (typeof M !== "undefined" && M && M.toast){
                            M.toast({html: `Import failed: ${message}`, classes: "red darken-2"})
                        }
                        this.$set(this.syncingGroups, syncKey, false)
                        if (this._sharedImportStartedAt){
                            delete this._sharedImportStartedAt[syncKey]
                        }
                    })
                    .finally(()=>{
                        this._sharedImportInFlight[syncKey] = false
                    })
            }
            runStep()
        },
        retrySharePush: function(group, options){
            options = options || {}
            let manual = options.manual !== false
            if (!group || !group.owner || !group.resourceName){
                return
            }
            if (!this.recipientConnected){
                if (typeof M !== "undefined" && M && M.toast){
                    M.toast({html: "Connect account first, then retry push.", classes: "amber darken-2"})
                }
                this.connectAccount()
                return
            }
            let call = window.appCall
            if (typeof call !== "function"){
                if (typeof M !== "undefined" && M && M.toast){
                    M.toast({html: "App API failed to load. Hard refresh the page."})
                }
                return
            }
            let syncKey = this.getSharedGroupSyncKey(group)
            if (!this._pushRetryInFlight){
                this._pushRetryInFlight = {}
            }
            if (!this._lastPushRetryAt){
                this._lastPushRetryAt = {}
            }
            if (this._pushRetryInFlight[syncKey]){
                return
            }
            let lastAt = Number(this._lastPushRetryAt[syncKey] || 0)
            if (Date.now() - lastAt < 15000){
                this.ensureSharedImportProgressPoll(group)
                if (manual && typeof M !== "undefined" && M && M.toast){
                    M.toast({
                        html: "Push already queued recently. Give it a minute.",
                        classes: "blue-grey darken-1",
                    })
                }
                return
            }
            this._pushRetryInFlight[syncKey] = true
            this._lastPushRetryAt[syncKey] = Date.now()
            this.ensureSharedImportProgressPoll(group)
            call("retrySharePush", [group.owner, group.resourceName])
                .then((result)=>{
                    if (Array.isArray(result?.sharedGroups)){
                        this.applySharedGroupUpdate(group.owner, group.resourceName, result.sharedGroups)
                    }
                    if (manual && typeof M !== "undefined" && M && M.toast){
                        if (result?.status === "already_running"){
                            M.toast({html: "Push already running.", classes: "blue-grey darken-1"})
                        } else {
                            M.toast({html: "Push retry queued.", classes: "green darken-1"})
                        }
                    }
                })
                .catch((error)=>{
                    if (manual && typeof M !== "undefined" && M && M.toast){
                        M.toast({html: `Push retry failed: ${formatClientError(error)}`, classes: "red darken-2"})
                    }
                    if (syncKey){
                        this.$set(this.syncingGroups, syncKey, false)
                    }
                })
                .finally(()=>{
                    this._pushRetryInFlight[syncKey] = false
                })
        },
        stopOwnerPushStatusPoll: function(resourceName){
            if (this._ownerPushPollers && this._ownerPushPollers[resourceName]){
                clearInterval(this._ownerPushPollers[resourceName])
                delete this._ownerPushPollers[resourceName]
            }
        },
        startOwnerPushStatusPoll: function(resourceName, ownerKey, initialMessage){
            if (!resourceName || !ownerKey){
                return
            }
            if (!this._ownerPushPollers){
                this._ownerPushPollers = {}
            }
            this.stopOwnerPushStatusPoll(resourceName)
            let pollCount = 0
            let tick = ()=>{
                let call = window.appCall
                if (typeof call !== "function"){
                    return
                }
                call("getSharePushStatus", [ownerKey, resourceName])
                    .then(({recipients})=>{
                        pollCount++
                        let rows = Array.isArray(recipients) ? recipients : []
                        let formatOwnerPushStatus = (row)=>{
                            return String(
                                row.displayStatus ||
                                row.pushStatus ||
                                row.groupStatus ||
                                "unknown"
                            )
                        }
                        if (rows.length){
                            this.syncStatusMessage = rows
                                .map((row)=>`${row.recipientEmail}: ${formatOwnerPushStatus(row)}`)
                                .join(" • ")
                        } else if (initialMessage){
                            this.syncStatusMessage = initialMessage
                        }
                        let stillActive = rows.some((row)=>{
                            let groupStatus = String(row.groupStatus || "")
                            let jobStatus = row.job && row.job.status
                            if (groupStatus.startsWith("Shared") || groupStatus.startsWith("Error")){
                                return false
                            }
                            if (jobStatus === "done"){
                                return false
                            }
                            let text = formatOwnerPushStatus(row)
                            if (text.startsWith("Ready")){
                                return jobStatus === "queued" || jobStatus === "running"
                            }
                            if (text.startsWith("Waiting for recipient to connect")){
                                return false
                            }
                            return (
                                text.startsWith("Pushing") ||
                                text.startsWith("Importing") ||
                                text.startsWith("Photos") ||
                                text.startsWith("Queued") ||
                                text.startsWith("Ready") ||
                                jobStatus === "queued" ||
                                jobStatus === "running"
                            )
                        })
                        if (!stillActive || pollCount > 600){
                            this.stopOwnerPushStatusPoll(resourceName)
                            this.syncStatusMessage = ""
                            this.shareStatusMessage = ""
                            this.shareStatusIsError = false
                            this.ownerSyncRequiredMessage = ""
                        }
                    })
                    .catch(()=>{})
            }
            this._ownerPushPollers[resourceName] = setInterval(tick, 2000)
            tick()
        },
        isGroupSyncing: function(resourceName){
            return !!(this.syncingGroups && this.syncingGroups[resourceName])
        },
        getOwnerSyncButtonLabel: function(group){
            if (!group){
                return "Syncing"
            }
            let resourceName = group.resourceName || ""
            let localLabel = resourceName ? this.ownerSyncLabels[resourceName] : ""
            if (localLabel){
                return localLabel
            }
            let persisted = resolveOwnerSyncCountLabel(group)
            if (persisted){
                return persisted
            }
            let total = Number(group.memberCount || 0)
            if (total > 0){
                return `0/${total}`
            }
            return "Syncing"
        },
        getOwnerSyncDisplayText: function(group){
            if (!group){
                return ""
            }
            if (this.isGroupSyncing(group.resourceName)){
                return this.getOwnerSyncButtonLabel(group)
            }
            return this.getOwnerSyncButtonText(group)
        },
        shouldShowOwnerSyncText: function(group){
            return !!this.getOwnerSyncButtonText(group)
        },
        getOwnerSyncButtonText: function(group){
            if (!group){
                return ""
            }
            if (!group.shared || !group.shared.length){
                return ""
            }
            let resourceName = group.resourceName || ""
            let localLabel = resourceName ? this.ownerSyncLabels[resourceName] : ""
            if (localLabel){
                return localLabel
            }
            let persisted = resolveOwnerSyncCountLabel(group)
            if (persisted){
                return persisted
            }
            if (this.isGroupSyncing(resourceName) || this.activeOwnerSyncResourceName === resourceName){
                return `0/${Number(group.memberCount || 0)}`
            }
            return ""
        },
        seedOwnerSyncLabelsFromGroups: function(){
            (this.groupsList || []).forEach((group)=>{
                if (!group || !group.resourceName){
                    return
                }
                if (!group.shared || !group.shared.length){
                    return
                }
                if (this.ownerSyncLabels[group.resourceName]){
                    return
                }
                let label = resolveOwnerSyncCountLabel(group)
                if (label){
                    this.$set(this.ownerSyncLabels, group.resourceName, label)
                }
            })
        },
        isOwnerSyncZeroState: function(group){
            if (!group){
                return false
            }
            if (!this.isGroupSyncing(group.resourceName)){
                return false
            }
            let label = String(this.getOwnerSyncButtonLabel(group) || "").trim()
            let match = label.match(/^(\d+)\s*\/\s*(\d+)$/)
            if (!match){
                return false
            }
            let done = Number(match[1])
            let total = Number(match[2])
            return total > 0 && done === 0
        },
        startOwnerSync: function(resourceName, resetSync){
            console.log("startOwnerSync called", resourceName);
            if (!resourceName){
                this.syncStatusMessage = "Sync failed: missing group id."
                return
            }
            if (this.isGroupSyncing(resourceName)){
                this.syncStatusMessage = "Sync already in progress..."
                return
            }
            let group = this.groupsById ? this.groupsById[resourceName] : null
            if (!group && Array.isArray(this.groupsList)){
                group = this.groupsList.find(item=>item && item.resourceName === resourceName) || null
            }
            if (!group){
                console.error("Group not found", resourceName);
                this.syncStatusMessage = "Sync failed: group not found in current view."
                return
            }
            let shared = Array.isArray(group.shared) ? group.shared : []
            if (!shared.length){
                this.syncStatusMessage = "This group is not shared yet. Share it first, then sync."
                if (typeof M !== "undefined" && M && M.toast){
                    M.toast({html: "Share this group first before syncing.", classes: "amber darken-2"})
                }
                return
            }
            
            if (!this.profile || !this.profile.email) {
                console.error("Profile not loaded");
                this.syncStatusMessage = "Sync failed: Profile not loaded."
                return
            }

            this.$set(this.ownerSyncPollErrors, resourceName, 0)
            this.$set(this.ownerProgressProbeAt, resourceName, 0)
            this.activeOwnerSyncResourceName = resourceName
            let total = Math.floor(Number((group && group.memberCount) || 0))
            console.log("Group member count:", group ? group.memberCount : "N/A", "Total:", total);
            this.$set(this.ownerSyncLabels, resourceName, `${0}/${total}`)
            this.$set(this.syncingGroups, resourceName, true)
            this.shareStatusMessage = ""
            this.shareStatusIsError = false
            this.ownerSyncRequiredMessage = ""
            console.log("Sync started for:", resourceName, "Label:", this.ownerSyncLabels[resourceName]);
            this.syncStatusMessage = total > 0 ? `Syncing... (0/${total})` : "Syncing..."
            let ownerKey = this.profile.email
            let pollCount = 0
            let finishOwnerSync = (doneMsg, keepPollingPush)=>{
                this.$set(this.ownerSyncPollErrors, resourceName, 0)
                this.$set(this.syncingGroups, resourceName, false)
                this.activeOwnerSyncResourceName = ""
                this.$delete(this.ownerProgressProbeAt, resourceName)
                clearOwnerShareNotices.call(this, {keepSyncStatus: keepPollingPush})
                reconcileOwnerSyncRequiredMessage.call(this)
                this.refreshAppData()
                if (keepPollingPush){
                    this.syncStatusMessage = doneMsg || ""
                    this.startOwnerPushStatusPoll(resourceName, ownerKey, this.syncStatusMessage)
                }
            }
            let probeOwnerSyncProgress = ()=>{
                let probeCall = window.appCall
                if (typeof probeCall !== "function"){
                    return
                }
                probeCall("getOwnerGroupSyncProgress", [ownerKey, resourceName])
                    .then((snapshot)=>{
                        let snapGroup = snapshot && snapshot.group
                        let snapProgress = snapshot && snapshot.progress
                        if (snapGroup && this.groupsById){
                            this.$set(this.groupsById, resourceName, snapGroup)
                        }
                        let done = Number((snapProgress && snapProgress.done) || 0)
                        let totalSnap = Number(
                            (snapProgress && snapProgress.total) ||
                            (snapGroup && snapGroup.memberCount) ||
                            0
                        )
                        if (totalSnap > 0){
                            if (done < 0){
                                done = 0
                            }
                            if (done > totalSnap){
                                done = totalSnap
                            }
                            this.$set(this.ownerSyncLabels, resourceName, `${done}/${totalSnap}`)
                            this.syncStatusMessage = `Syncing... (${done}/${totalSnap})`
                        }
                    })
                    .catch(()=>{})
            }
            let runStep = (reset)=>{
                if (this.ownerSyncInFlight[resourceName]){
                    return
                }
                this.$set(this.ownerSyncInFlight, resourceName, true)
                pollCount++
                let call = window.appCall
                if (typeof call !== "function"){
                    this.$set(this.ownerSyncInFlight, resourceName, false)
                    this.syncStatusMessage = "App API failed to load. Hard refresh the page."
                    return
                }
                call("syncSharedGroup", [ownerKey, resourceName, 90, !!reset])
                    .then((response)=>{
                        this.$set(this.ownerSyncInFlight, resourceName, false)
                        let groups = response && response.groups
                        let syncStatus = response && response.syncStatus
                        let progressByGroup = response && response.progressByGroup
                        let pending = !!(response && response.pending)
                        let busy = !!(response && response.busy)
                        let pendingByStatus = false
                        let terminalByStatus = false
                        if (syncStatus && typeof syncStatus === "object"){
                            let statusValues = Object.values(syncStatus).map(status=>String(status || ""))
                            pendingByStatus = statusValues.some(text=>{
                                return text.startsWith("Syncing") || text.startsWith("Queued")
                            })
                            terminalByStatus = statusValues.some(text=>{
                                return text.startsWith("Synced") ||
                                    text.startsWith("Ready") ||
                                    text.startsWith("Shared") ||
                                    text.startsWith("Error") ||
                                    text.startsWith("Connect required") ||
                                    text.startsWith("No sharedGroups") ||
                                    text.startsWith("Group not found") ||
                                    text.startsWith("Failed") ||
                                    text.startsWith("Missing")
                            })
                        }
                        console.log("Sync step:", {pending, resourceName});
                        if (groups && typeof groups === "object"){
                            let mergedGroups = Object.assign({}, this.groupsById || {})
                            Object.keys(groups).forEach(id=>{
                                let existing = mergedGroups[id] || {}
                                let incoming = groups[id] || {}
                                mergedGroups[id] = Object.assign({}, existing, incoming)
                            })
                            this.groupsById = mergedGroups
                            this.groupsList = Object.values(this.groupsById).sort((a, b) => (a.name || "").localeCompare((b.name || ""), undefined, {sensitivity: "base"}))
                        }
                        let latestGroup = this.groupsById ? this.groupsById[resourceName] : null
                        let progressFromResponse = progressByGroup && progressByGroup[resourceName]
                        if (!pending && !pendingByStatus && !terminalByStatus && !busy){
                            let progressDone = Number(
                                (progressFromResponse && progressFromResponse.done) ||
                                (latestGroup && latestGroup.syncProgress && latestGroup.syncProgress.done) ||
                                0
                            )
                            let progressTotal = Number(
                                (progressFromResponse && progressFromResponse.total) ||
                                (latestGroup && latestGroup.memberCount) ||
                                0
                            )
                            if (progressTotal > 0 && progressDone >= progressTotal){
                                pending = false
                            } else if (latestGroup){
                                let statusText = String(latestGroup.status || "")
                                pending = !(statusText.startsWith("Synced") || statusText.startsWith("Ready"))
                            } else {
                                pending = true
                            }
                        }
                        if (latestGroup){
                            let progress = latestGroup.syncProgress || {}
                            let done = Number((progressFromResponse && progressFromResponse.done) || progress.done || 0)
                            let totalFromGroup = Number(
                                (progressFromResponse && progressFromResponse.total) ||
                                latestGroup.memberCount ||
                                progress.total ||
                                0
                            )
                            
                            // Attempt to parse progress from syncStatus text if structured progress is missing
                            if (done === 0 && syncStatus) {
                                Object.values(syncStatus).forEach(statusStr => {
                                    let match = String(statusStr).match(/(\d+)\/(\d+)/);
                                    if (match) {
                                        let d = Number(match[1]);
                                        if (d > done) done = d;
                                    }
                                });
                            }
                            
                            if (totalFromGroup > 0){
                                if (done < 0){
                                    done = 0
                                }
                                if (done > totalFromGroup){
                                    done = totalFromGroup
                                }
                                this.$set(this.ownerSyncLabels, resourceName, `${done}/${totalFromGroup}`)
                                if (pending){
                                    this.syncStatusMessage = `Syncing... (${done}/${totalFromGroup})`
                                }
                            }
                        } else if (pending && !this.ownerSyncLabels[resourceName]){
                            let fallbackGroup = Array.isArray(this.groupsList)
                                ? this.groupsList.find(item=>item && item.resourceName === resourceName)
                                : null
                            let fallbackTotal = Number((fallbackGroup && fallbackGroup.memberCount) || 0)
                            this.$set(this.ownerSyncLabels, resourceName, `${0}/${fallbackTotal}`)
                        }
                        if (pending && (!progressFromResponse || !latestGroup)){
                            let lastProbe = Number(this.ownerProgressProbeAt[resourceName] || 0)
                            let currentLabel = String(this.ownerSyncLabels[resourceName] || "")
                            let isZeroLabel = /^\s*0\s*\/\s*\d+\s*$/.test(currentLabel)
                            let probeEvery = isZeroLabel ? 1 : 3
                            if ((pollCount - lastProbe) >= probeEvery){
                                this.$set(this.ownerProgressProbeAt, resourceName, pollCount)
                                probeOwnerSyncProgress()
                            }
                        }
                        if (syncStatus && Object.keys(syncStatus).length){
                            this.syncStatusMessage = Object.entries(syncStatus)
                                .map(([email, status]) => `${email}: ${status}`)
                                .join(" • ")
                        } else if (pending && busy){
                            this.syncStatusMessage = "Waiting for previous sync step..."
                        } else if (pending){
                            this.syncStatusMessage = "Syncing..."
                        }
                        let pendingByGroupStatus = false
                        if (latestGroup){
                            let latestStatusText = String(latestGroup.status || "")
                            pendingByGroupStatus = latestStatusText.startsWith("Syncing") || latestStatusText.startsWith("Queued")
                        }
                        if (!pending && (pendingByStatus || pendingByGroupStatus)){
                            pending = true
                        }
                        // Safety valve: if polling runs too long, reconcile from latest app state.
                        if (pollCount > 80){
                            this.refreshAppData()
                            let latest = this.groupsById ? this.groupsById[resourceName] : null
                            let statusText = String((latest && latest.status) || "")
                            let stillPending = statusText.startsWith("Syncing")
                            if (!stillPending){
                                this.$set(this.syncingGroups, resourceName, false)
                                clearOwnerShareNotices.call(this)
                                reconcileOwnerSyncRequiredMessage.call(this)
                                return
                            }
                        }
                        if (pending){
                            this.$set(this.syncingGroups, resourceName, true)
                            if (!this.ownerSyncLabels[resourceName]){
                                let totalFallback = Number((latestGroup && latestGroup.memberCount) || (group && group.memberCount) || 0)
                                this.$set(this.ownerSyncLabels, resourceName, `${0}/${totalFallback}`)
                            }
                            this.$set(this.ownerSyncPollErrors, resourceName, 0)
                            if (pollCount > 1200){
                                this.$set(this.syncingGroups, resourceName, false)
                                this.$delete(this.ownerProgressProbeAt, resourceName)
                                this.syncStatusMessage = "Sync polling paused after a long run. Tap Sync to continue."
                                return
                            }
                            let delay = busy ? 800 : 400
                            setTimeout(()=>runStep(false), delay)
                            return
                        }
                        let doneMsg = latestGroup ? String(latestGroup.status || "") : ""
                        if (!doneMsg && syncStatus && typeof syncStatus === "object"){
                            doneMsg = Object.entries(syncStatus)
                                .map(([email, status]) => `${email}: ${status}`)
                                .join(" • ")
                        }
                        let hasActivePush = syncStatus && typeof syncStatus === "object" &&
                            Object.values(syncStatus).some((status)=>{
                                let text = String(status || "")
                                return (
                                    text.startsWith("Pushing") ||
                                    text.startsWith("Importing") ||
                                    text.startsWith("Photos (")
                                )
                            })
                        finishOwnerSync(doneMsg, hasActivePush)
                    })
                    .catch((error)=>{
                        this.$set(this.ownerSyncInFlight, resourceName, false)
                        let attempts = Number(this.ownerSyncPollErrors[resourceName] || 0) + 1
                        this.$set(this.ownerSyncPollErrors, resourceName, attempts)
                        if (attempts < 8){
                            this.syncStatusMessage = `Syncing... (retry ${attempts})`
                            setTimeout(()=>runStep(false), 1200)
                            return
                        }
                        this.$set(this.syncingGroups, resourceName, false)
                        this.activeOwnerSyncResourceName = ""
                        this.$delete(this.ownerProgressProbeAt, resourceName)
                        this.syncStatusMessage = `Sync stopped after retries: ${formatClientError(error)}`
                        if (typeof M !== "undefined" && M && M.toast){
                            M.toast({html: this.syncStatusMessage, classes: "red darken-2"})
                        }
                        console.error(error)
                    })
            }
            runStep(!!resetSync)
        },

        },
        reconnectAccount: function(){
            let call = window.appCall
            if (typeof call !== "function"){
                if (M && M.toast){
                    M.toast({html: "App API failed to load. Hard refresh the page."})
                }
                return
            }
            call("disconnectRecipient", [])
                .then(({authorized, url})=>{
                    this.recipientConnected = !!authorized
                    if (url){
                        window.location.href = url
                        return
                    }
                    this.connectAccount()
                })
                .catch((error)=>{
                    console.error(error)
                    if (M && M.toast){
                        M.toast({html: formatClientError(error)})
                    }
                })
        },
    }
    
    let initMaterialize = function(){
        if (typeof M === "undefined" || !M){
            return
        }
        let elems
        let options
        
        // initialize side navbar for mobile
        elems = document.querySelectorAll('.sidenav')
        M.Sidenav.init(elems)
        
        
        // initialize modal popups
        elems = document.querySelectorAll('.modal')
        M.Modal.init(elems)
        this.bindDismissModalActions()
        
        // initialize share email chip
        elems = document.querySelectorAll('.chip-share-emails')
        options = {
            placeholder: "Add email"
        }
        M.Chips.init(elems, options)
    }

    let applyAppData = function(result){
        this.isLoading = false
        this.hasLoadError = false
        this.profile = (result && result.profile) ? result.profile : { displayName: "", email: "" }
        this.groupsById = (result && result.groups) ? result.groups : {}
        this.groupsList = Object.values(this.groupsById).sort((a, b) => (a.name || "").localeCompare((b.name || ""), undefined, {sensitivity: "base"}))
        if (Array.isArray(result && result.dismissedSharedGroups)){
            result.dismissedSharedGroups.forEach((key)=>{
                let normalized = String(key || "").trim()
                if (normalized){
                    this.$set(this.dismissedSharedGroupKeys, normalized, true)
                }
            })
        }
        this.sharedGroups = filterDismissedSharedGroups(
            (result && result.sharedGroups) ? result.sharedGroups : [],
            this.dismissedSharedGroupKeys
        )
        this.recipientConnected = !!(result && result.recipientConnected)
        if (result && result.appConfig){
            this.sendShareEmailsEnabled = !!result.appConfig.sendShareEmails
            this.inviteUrl = String(result.appConfig.inviteUrl || "").trim()
            this.sharedContactsGroupName = String(result.appConfig.sharedContactsGroupName || "").trim()
            this.sharedContactsGroupResourceName = String(result.appConfig.sharedContactsGroupResourceName || "").trim()
        }
        this.sharedGroups.forEach((group)=>{
            this.updateSharedImportProgressUi(group)
            let syncKey = this.getSharedGroupSyncKey(group)
            if (syncKey && !isSharedGroupPending_(group)){
                this.$delete(this.syncingGroups, syncKey)
            }
            this.ensureSharedImportProgressPoll(group)
        })
        this.seedOwnerSyncLabelsFromGroups()
        reconcileOwnerSyncRequiredMessage.call(this)
        this.bindSharedGroupsTableActions()
    }

    let failAppLoad = function(error){
        this.isLoading = false
        this.hasLoadError = true
        this.error = formatClientError(error)
        console.error("loadApp failed:", this.error)
        let message = String(this.error || "").toLowerCase()
        if (
            message.includes("not signed in") ||
            message.includes("sign in again") ||
            message.includes("sign-in expired")
        ){
            window.location.href = this.signInAgainUrl || "/auth/owner/login"
        }
    }

    let bootstrapApp = function(){
        let call = window.appCall
        if (typeof call !== "function"){
            failAppLoad.call(this, new Error("App API bridge failed to load. Hard refresh the page."))
            return
        }
        call("loadApp", [this.viewMode, false])
            .then(function(result){
                applyAppData.call(this, result)
                initMaterialize.call(this)
                this.$nextTick(()=>{
                    if (this.viewMode === "shared" && this.recipientConnected){
                        this.resumePendingSharedImports()
                        this.startRecipientImportWatcher()
                    }
                })
            }.bind(this))
            .catch(function(error){
                failAppLoad.call(this, error)
                initMaterialize.call(this)
            }.bind(this))
    }
    
    
    window.__appVm = new Vue({
        el: "#app",
        data,
        computed: {
            accountLabel: function(){
                let email = String(this.profile.email || "").trim()
                if (email){
                    return email
                }
                return String(this.profile.displayName || "").trim() || "Signed in"
            },
            sharedPageUrl: function(){
                let email = String(this.inviteRecipientEmail || "").trim()
                if (email){
                    return `/?mode=shared&email=${encodeURIComponent(email)}`
                }
                return "/?mode=shared"
            },
            switchAccountUrl: function(){
                let email = String(this.inviteRecipientEmail || "").trim()
                if (email){
                    return `/auth/logout?mode=shared&email=${encodeURIComponent(email)}`
                }
                return "/auth/logout?mode=shared"
            },
            signInAgainUrl: function(){
                let email = String(this.inviteRecipientEmail || "").trim()
                if (this.viewMode === "shared"){
                    if (email){
                        return `/auth/owner/login?mode=shared&email=${encodeURIComponent(email)}`
                    }
                    return "/auth/owner/login?mode=shared"
                }
                return "/auth/owner/login"
            },
            needsRecipientReconnect: function(){
                if (this.viewMode !== "shared"){
                    return false
                }
                return (this.sharedGroups || []).some((group)=>{
                    let status = String(group && group.status || "").toLowerCase()
                    return status.includes("reconnect account") || status.includes("refresh the access token")
                })
            },
        },
        methods: Object.assign({}, methods, {
            bootstrapApp,
        }),
        mounted: function(){
            try {
                this.bootstrapApp()
            } catch (err) {
                failAppLoad.call(this, err)
            }
        },
    })
</script>
