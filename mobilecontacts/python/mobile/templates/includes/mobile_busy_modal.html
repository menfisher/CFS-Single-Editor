<dialog class="mobile-busy-modal mobile-busy-modal-is-busy" id="mobile-busy-modal" aria-labelledby="mobile-busy-title">
  <div class="mobile-busy-panel">
    <div class="mobile-busy-spinner" id="mobile-busy-spinner" aria-hidden="true"></div>
    <h2 class="mobile-busy-title" id="mobile-busy-title">Syncing</h2>
    <p class="mobile-busy-message" id="mobile-busy-message">Please wait…</p>
    <p class="mobile-busy-error" id="mobile-busy-error" hidden></p>
    <button type="button" class="mobile-button mobile-busy-dismiss" id="mobile-busy-dismiss" hidden>Dismiss</button>
  </div>
</dialog>
