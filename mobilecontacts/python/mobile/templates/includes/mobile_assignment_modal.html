<dialog class="mobile-assignment-modal" id="mobile-assignment-modal">
  <form method="dialog" class="mobile-assignment-modal-panel" id="mobile-assignment-modal-form">
    <h2 class="mobile-assignment-modal-title" id="mobile-assignment-modal-title">Add Option</h2>
    <p class="mobile-assignment-modal-copy" id="mobile-assignment-modal-copy">Enter a name for the new option.</p>
    <label class="mobile-assignment-modal-field" id="mobile-assignment-modal-field">
      <span class="mobile-edit-label" id="mobile-assignment-modal-label">Name</span>
      <input type="text" id="mobile-assignment-modal-input" autocomplete="off">
    </label>
    <p class="mobile-assignment-modal-error" id="mobile-assignment-modal-error" aria-live="polite"></p>
    <div class="mobile-assignment-modal-actions">
      <button type="button" class="mobile-button mobile-button-secondary" id="mobile-assignment-modal-cancel">Cancel</button>
      <button type="submit" class="mobile-button" id="mobile-assignment-modal-save">Save</button>
    </div>
  </form>
</dialog>
