<dialog class="mobile-editor-timeout-modal" id="mobile-editor-timeout-modal" aria-labelledby="mobile-editor-timeout-title">
  <form method="dialog" class="mobile-editor-timeout-panel">
    <h2 class="mobile-editor-timeout-title" id="mobile-editor-timeout-title">Editor Time Almost Up</h2>
    <p class="mobile-editor-timeout-copy">
      Your Editor session will close in <strong id="mobile-editor-timeout-countdown">2:00</strong>.
    </p>
    <p class="mobile-editor-timeout-copy">If more time is needed, add 15 minutes now.</p>
    <p class="mobile-editor-timeout-error" id="mobile-editor-timeout-error" hidden></p>
    <div class="mobile-editor-timeout-actions">
      <button type="button" class="mobile-button mobile-button-secondary" id="mobile-editor-timeout-signout">Sign out</button>
      <button type="button" class="mobile-button" id="mobile-editor-timeout-extend">Add 15 minutes</button>
    </div>
  </form>
</dialog>
